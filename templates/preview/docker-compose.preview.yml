services:
  web:
    image: nginx:1.27-alpine
    mem_limit: ${PREVIEW_MEM}
    cpus: ${PREVIEW_CPUS}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "127.0.0.1:${PREVIEW_PORT}:80"
    labels:
      roxira.preview: "${PREVIEW_LABEL}"
      roxira.preview.created: "${PREVIEW_CREATED_EPOCH}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
