<svg xmlns="http://www.w3.org/2000/svg" width="280" height="96" viewBox="0 0 280 96" role="img" aria-label="شعار سامانه قاضی هوشمند">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e08a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a97c1f"/>
    </linearGradient>
    <radialGradient id="bgGold" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- Emblem: gold scale of justice inside badge -->
  <g transform="translate(10,8)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#bgGold)" stroke="url(#gold)" stroke-width="3"/>
    <g transform="translate(14,14) scale(1.15)">
      <!-- scales -->
      <line x1="18" y1="4" x2="46" y2="10" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="18" cy="10" r="3" fill="url(#gold)"/>
      <!-- left pan -->
      <path d="M18 10 L10 22 L26 24 Z" fill="url(#gold)" opacity="0.95"/>
      <line x1="14" y1="24" x2="10" y2="24" stroke="url(#gold)" stroke-width="2"/>
      <line x1="14" y1="24" x2="18" y2="24" stroke="url(#gold)" stroke-width="2"/>
      <!-- right pan -->
      <path d="M46 10 L38 24 L54 22 Z" fill="url(#gold)" opacity="0.95"/>
      <line x1="42" y1="24" x2="46" y2="24" stroke="url(#gold)" stroke-width="2"/>
      <line x1="42" y1="24" x2="38" y2="24" stroke="url(#gold)" stroke-width="2"/>
      <!-- center post -->
      <line x1="32" y1="16" x2="32" y2="36" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="36" r="2.5" fill="url(#gold)"/>
      <!-- gavel cross -->
      <rect x="20" y="30" width="24" height="4" rx="2" fill="url(#gold)" transform="rotate(-20 32 26)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="88" y="40" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="url(#gold)" letter-spacing="0.5">سامانه قاضی هوشمند</text>
  <text x="88" y="66" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#d4af37" letter-spacing="1">SMART JUDGE SYSTEM</text>
  <line x1="88" y1="76" x2="268" y2="76" stroke="url(#gold)" stroke-width="1.4" opacity="0.7"/>
</svg>